name: Android Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y $(cat .github/workflows/apt-deps.txt) ccache zstd

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr --parallel
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.THAI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.THAI_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Using the permanent key from repository secrets"
            echo "$KS_B64" | base64 -d > Android/app/release.jks
            echo "SIGN_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "No secrets found - using a temporary key (APK cannot update over older builds)"
            keytool -genkeypair -keystore Android/app/release.jks -alias thai \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass thaithai123 -keypass thaithai123 \
              -dname "CN=Thai OoT Build"
            echo "SIGN_PASS=thaithai123" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          cd Android && ./gradlew assembleRelease \
            -PstoreFile=release.jks \
            -PstorePassword="$SIGN_PASS" \
            -PkeyAlias=thai \
            -PkeyPassword="$SIGN_PASS"

      - name: Show ccache statistics
        run: ccache --show-stats

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soh-apk
          path: Android/app/build/outputs/apk/release/*.apk
